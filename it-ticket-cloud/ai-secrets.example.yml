# 复制为 ai-secrets.yml（已被 gitignore 忽略，绝不提交实际凭据），把下面的占位值换成真实值。
#
# 放哪里？该文件按「运行工作目录」解析（./ai-secrets.yml）：
#   - IDEA 默认工作目录 = $MODULE_WORKING_DIR$ → 放到对应模块根（consultation-service/、rag-service/）
#   - 工作目录指到 it-ticket-cloud/ 或仓库根 → 放到那一层（一份合并版即可，两段都在）
# 也可以不改本文件，改用环境变量注入：AI_BASE_URL / AI_API_KEY / AI_MODEL / EMBEDDING_* /
# AI_AGENT_ENABLED（环境变量优先级高于本文件）。
#
# ⚠️ 排查口诀：AI 问答报「服务暂时不可用」且日志 errorClass=NOT_CONFIGURED（costMs=0）
#    = 凭据为空（本文件没被读到或值没填），不是服务连不通。
itticket:
  consultation:
    ai:
      provider: openai-compatible
      retrieval-provider: rag-service
      rag-base-url: http://127.0.0.1:8302        # consultation → rag-service(Java) 检索地址
      base-url: https://your-llm-gateway.example.com/v1   # OpenAI 兼容对话模型端点
      model: deepseek-v4-flash                   # 必须支持原生 tools（别用思考型，延迟差 4~13 倍）
      api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxx
      agent:
        enabled: true                            # Function Calling 智能体总开关（查工单/建单）
rag:
  embedding:
    base-url: https://your-embed-gateway.example.com/v1  # embedding 网关（需支持 dimensions）
    model: qwen3-embedding-8b
    api-key: sk-yyyyyyyyyyyyyyyyyyyyyyy
    dimensions: 1024                             # 与 ES mapping 一致，勿改
