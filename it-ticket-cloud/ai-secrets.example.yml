# 复制为 ai-secrets.yml（已被 gitignore），在本地填写值，不要提交实际凭据。
# AI_SECRETS_FILE 与 RAG_SECRETS_FILE 均指向该文件的绝对路径，再启动两个服务。
itticket:
  consultation:
    ai:
      provider: openai-compatible
      retrieval-provider: rag-service
      rag-base-url: http://127.0.0.1:8302
      base-url: ${AI_BASE_URL:}
      model: ${AI_MODEL:}
      api-key: ${AI_API_KEY:}
rag:
  embedding:
    base-url: ${EMBEDDING_BASE_URL:}
    model: ${EMBEDDING_MODEL:}
    api-key: ${EMBEDDING_API_KEY:}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  scheme: ${ES_SCHEME:http}
  index-name: ${ES_KNOWLEDGE_INDEX:knowledge_chunk}
