server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 36000
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: ticket-service
          uri: lb://ticket-service
          predicates:
            # ticket-drafts:提单草稿(spec 05 saveTicketDraft,2026-09 新契约)
            - Path=/api/v1/tickets/**,/api/v1/ticket-drafts/**
        # 智能客服与转人工(AI-005 / OpenAPI 05 的 /consultations 系列 + 知识搜索)
        - id: consultation-service
          uri: lb://consultation-service
          predicates:
            - Path=/api/v1/consultations/**,/api/v1/knowledge/**

itticket:
  jwt:
    # 必须与 user-service 一致;生产用环境变量 JWT_SECRET 或 Nacos 配置中心覆盖
    secret: ${JWT_SECRET:it-ticket-dev-jwt-secret-key-32bytes-minimum!!}

logging:
  level:
    root: info
