server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 36000
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: ticket-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/v1/tickets/**
        # ai-service:AI 智能受理(问答/人工客服/知识库)
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**
        # ai-service 的 WebSocket(人工实时聊天);握手鉴权由 ai-service 自行校验 token 参数
        - id: ai-service-ws
          uri: lb:ws://ai-service
          predicates:
            - Path=/ws/ai/**

itticket:
  jwt:
    # 必须与 user-service 一致;生产用环境变量 JWT_SECRET 或 Nacos 配置中心覆盖
    secret: ${JWT_SECRET:it-ticket-dev-jwt-secret-key-32bytes-minimum!!}

logging:
  level:
    root: info
