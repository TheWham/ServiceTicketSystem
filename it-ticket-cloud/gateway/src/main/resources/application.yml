server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 36000
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: ticket-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/v1/tickets/**

itticket:
  jwt:
    # 必须与 user-service 一致;生产用环境变量 JWT_SECRET 或 Nacos 配置中心覆盖
    secret: ${JWT_SECRET:it-ticket-dev-jwt-secret-key-32bytes-minimum!!}

logging:
  level:
    root: info
