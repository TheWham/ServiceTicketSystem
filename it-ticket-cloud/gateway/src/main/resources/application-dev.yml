# ============================================================
# 测试环境配置（本地开发默认）
# 与 nacos-config/gateway.yaml + common-config.yaml 内容一致，本地兜底
# 生产环境用 application-prod.yml，启动时 --spring.profiles.active=prod 切换
# ============================================================

# JWT 共享密钥（common-config.yaml 的内容；gateway 校验用）
itticket:
  jwt:
    secret: ${JWT_SECRET:it-ticket-dev-jwt-secret-key-32bytes-minimum!!}

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 36000
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: ticket-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/v1/tickets/**,/api/v1/ticket-drafts/**
        - id: consultation-service
          uri: lb://consultation-service
          predicates:
            - Path=/api/v1/consultations/**,/api/v1/knowledge/**
        - id: category-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/v1/categories/**
        - id: sla-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/v1/sla/**
        - id: notification-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: exception-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/v1/exceptions/**
        - id: rag-service
          uri: lb://rag-service
          predicates:
            - Path=/api/v1/rag/**
        # 知识库生命周期与检索（rag-service）
        - id: knowledge-service
          uri: lb://rag-service
          predicates:
            - Path=/api/v1/knowledge/**
        # AI 消息：本仓库只提供检索侧，路径精确到 ai-messages，
        # 避免抢占 AI 客服服务后续的 /api/v1/consultations/** 其余端点
        - id: consultation-ai-service
          uri: lb://rag-service
          predicates:
            - Path=/api/v1/consultations/*/ai-messages
