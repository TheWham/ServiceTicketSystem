# ============================================================
# 测试环境配置（本地开发默认）
# 与 nacos-config/user-service.yaml + common-config.yaml 一致，本地兜底
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:120.92.138.195}:${MYSQL_PORT:3306}/${MYSQL_DB:it_ticket_system}?useSSL=false&characterEncoding=utf8&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

itticket:
  jwt:
    secret: ${JWT_SECRET:it-ticket-dev-jwt-secret-key-32bytes-minimum!!}
    ttl-hours: 12
  auth:
    exclude-paths:
      - /api/v1/users/login
      - /api/v1/users/login-options
      - /api/v1/users/forgot-password
      - /api/internal/**
      - /api/health
      - /error

logging:
  level:
    root: info
    com.itticket.user.mapper: debug
