# Local development only. Do not expose this instance to other machines.
bind 127.0.0.1
protected-mode yes
port 6379
daemonize no
timeout 0
tcp-keepalive 60
databases 16

maxmemory 256mb
maxmemory-policy allkeys-lru

appendonly yes
appendfsync everysec
appenddirname appendonlydir
save 900 1
save 300 10
dbfilename dump.rdb

# Launcher working directory is .devtools/redis-data; all paths stay local.
dir ./
loglevel notice
logfile redis.log
