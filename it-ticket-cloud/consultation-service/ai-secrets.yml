# 【手动填写 1/2：智能客服的对话模型】
# 当前本地启动方式会读取本文件；修改后重启 consultation-service 生效。
# 本文件已被 Git 忽略。直接替换下面的值，保留英文引号和缩进。
itticket:
  consultation:
    ai:
      # 【填写 A】对话模型 Base URL：填兼容接口根地址，不要带 /chat/completions。
      base-url: "${AI_BASE_URL:}"
      # 【填写 B】对话模型 API Key：将真实 Key 填入下面的引号中。
      api-key: "${AI_API_KEY:}"
      # 【填写 C】对话模型名称：必须与上面端点提供的模型 ID 一致。
      model: "${AI_MODEL:}"

      # 以下是服务间连接，通常不用修改。
      provider: openai-compatible
      retrieval-provider: rag-service
      # 这是 RAG 服务地址，不是大模型 Base URL。
      rag-base-url: "http://127.0.0.1:8302"