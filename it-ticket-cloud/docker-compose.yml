# IT 工单系统微服务依赖:Nacos(注册+配置) + MySQL 8
# 注意:数据库已统一连远程库 120.92.138.195:3306（密码由 MYSQL_PASSWORD 注入）,
#       本 compose 里的 MySQL 仅为「离线/无远程库时的可选本地库」或 CI 用,
#       日常联调不需要启动它(服务默认连远程)。
# 用法:
#   Nacos:  docker compose up -d nacos
#   MySQL(可选):docker compose up -d mysql 起来后,注入 MYSQL_HOST=127.0.0.1 MYSQL_PASSWORD=root123
# MySQL 初始化自动执行 db/init/ 下的建库与种子脚本

networks:
  it-ticket-net:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: it-ticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD before starting MySQL}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - it-ticket-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - it-ticket-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: it-ticket-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"   # HTTP 控制台/OpenAPI
      - "9848:9848"   # gRPC 客户端(2.x 必需)
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - it-ticket-net

volumes:
  it-ticket-mysql-data:
