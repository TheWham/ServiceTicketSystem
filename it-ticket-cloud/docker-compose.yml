# IT 工单系统微服务依赖:Nacos(注册+配置) + Redis + MySQL 8
# 注意:数据库支持连本地或由环境变量注入远程库,
#       本 compose 里的 MySQL 仅为「离线/无远程库时的可选本地库」或 CI 用,
#       日常联调不需要启动它(服务默认连远程)。
# 用法:
#   Nacos:  docker compose up -d nacos
#   Redis:  docker compose up -d redis
#   MySQL(可选):docker compose up -d mysql 起来后,注入 MYSQL_HOST=127.0.0.1 MYSQL_PASSWORD=root123
# MySQL 初始化自动执行 db/init/ 下的建库与种子脚本

networks:
  it-ticket-net:
    driver: bridge

services:
  redis:
    image: redis:8.2.9-alpine
    container_name: it-ticket-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - it-ticket-redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Host port is loopback-only. Set REDIS_PASSWORD when other containers connect.
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - it-ticket-net

  mysql:
    image: mysql:8.0
    container_name: it-ticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - it-ticket-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - it-ticket-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: it-ticket-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"   # HTTP 控制台/OpenAPI
      - "9848:9848"   # gRPC 客户端(2.x 必需)
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - it-ticket-net

volumes:
  it-ticket-redis-data:
  it-ticket-mysql-data:
