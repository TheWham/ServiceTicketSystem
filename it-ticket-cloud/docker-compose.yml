# IT 工单系统微服务本地依赖:Nacos(注册+配置) + MySQL 8(双库)
# 用法:docker compose up -d
# MySQL 初始化自动执行 db/init/ 下的建库与种子脚本
services:
  mysql:
    image: mysql:8.0
    container_name: it-ticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - it-ticket-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: it-ticket-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"   # HTTP 控制台/OpenAPI
      - "9848:9848"   # gRPC 客户端(2.x 必需)

volumes:
  it-ticket-mysql-data:
