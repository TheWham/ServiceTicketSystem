# ============================================================
# 生产环境配置
# 敏感项一律走环境变量；启动：--spring.profiles.active=prod
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB:it_ticket_system}?useSSL=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}   # 生产必须注入，无默认值
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

spring.cloud.openfeign:
  client:
    config:
      user-service:
        connectTimeout: 2000
        readTimeout: 3000

itticket:
  auth:
    exclude-paths:
      - /api/health
      - /error

logging:
  level:
    root: warn
    com.itticket.ticket.mapper: info
