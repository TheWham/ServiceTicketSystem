server:
  port: 8201

spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/it_ticket?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

spring.cloud.openfeign:
  client:
    config:
      user-service:
        connectTimeout: 2000
        readTimeout: 3000

itticket:
  auth:
    exclude-paths:
      - /api/health
      - /error

logging:
  level:
    root: info
    com.itticket.ticket.mapper: debug
