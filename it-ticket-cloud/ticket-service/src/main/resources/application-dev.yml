# ============================================================
# 测试环境配置（本地开发默认）
# 与 nacos-config/ticket-service.yaml 一致，本地兜底
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:120.92.138.195}:${MYSQL_PORT:3306}/${MYSQL_DB:it_ticket_system}?useSSL=false&characterEncoding=utf8&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

spring.cloud.openfeign:
  client:
    config:
      user-service:
        connectTimeout: 2000
        readTimeout: 3000

itticket:
  auth:
    exclude-paths:
      - /api/health
      - /error

logging:
  level:
    root: info
    com.itticket.ticket.mapper: debug
