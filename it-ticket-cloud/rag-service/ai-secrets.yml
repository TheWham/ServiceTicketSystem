# 【手动填写 2/2：RAG 的向量 / Embedding 模型】
# 当前本地启动方式会读取本文件；修改后重启 rag-service 生效。
# 本文件已被 Git 忽略。向量模型与对话模型的 Key 分开填写。
rag:
  embedding:
    # 【填写 A】向量模型 Base URL：填兼容接口根地址，不要带 /embeddings。
    base-url: "${EMBEDDING_BASE_URL:}"
    # 【填写 B】向量模型 API Key：将真实 Key 填入下面的引号中。
    api-key: "${EMBEDDING_API_KEY:}"
    # 【填写 C】向量模型名称：这里填 Embedding 模型 ID，不要填对话模型名称。
    model: "${EMBEDDING_MODEL:}"
    # 【核对 D】输出向量维度，必须与 ES 中现有知识索引的向量维度一致。
    dimensions: 1024
  # 【手动填写 3/3：Dify 知识库通道】在 Dify 知识库页面右上角「服务 API」创建密钥。
  dify:
    enabled: true
    base-url: "http://120.92.138.195/v1"
    # 【填写 F】Dify 知识库 API Key：将真实 Key 填入下面的引号中（dataset- 开头）。
    api-key: "${DIFY_API_KEY:}"
    # 【可选】固定目标知识库 ID；留空则按 dataset-name 自动创建并复用。
    dataset-id: "${DIFY_DATASET_ID:}"
    dataset-name: "it-ticket-knowledge"

# 【核对 E】知识库的 Elasticsearch 地址；如果不在本机，请改为实际地址。
# host 只写主机名或 IP，不带 http:// 和端口。默认端口 9200。
elasticsearch:
  host: "localhost"
  port: 9200
  scheme: "http"
  index-name: "knowledge_chunk"