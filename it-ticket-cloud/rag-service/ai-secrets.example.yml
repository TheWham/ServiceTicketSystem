# rag-service 专用凭据示例（向量化）。
# 复制为 ai-secrets.yml（已被 gitignore 忽略，绝不提交实际凭据），把占位值换成真实值。
#
# 放哪里？本文件按「运行工作目录」解析（./ai-secrets.yml，经 RAG_SECRETS_FILE 导入）：
#   - IDEA 默认工作目录 = $MODULE_WORKING_DIR$ → 就放本模块根（rag-service/）
#   - 工作目录指到 it-ticket-cloud/ 或仓库根 → 放到那一层（用 ../ai-secrets.example.yml 合并版）
# 也可以不建本文件，改用环境变量：EMBEDDING_BASE_URL / EMBEDDING_API_KEY / EMBEDDING_MODEL /
# EMBEDDING_DIMENSIONS（环境变量优先级高于 ai-secrets.yml）。
rag:
  embedding:
    base-url: https://your-embed-gateway.example.com/v1  # embedding 网关（需支持 dimensions 参数）
    model: qwen3-embedding-8b
    api-key: sk-yyyyyyyyyyyyyyyyyyyyyyy
    dimensions: 1024                             # 与 ES mapping / 向量库一致，勿改
