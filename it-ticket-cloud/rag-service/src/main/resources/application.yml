server:
  # 8301 已由 consultation-service 占用（其 README 约定），rag-service 使用 8302
  port: ${RAG_SERVER_PORT:8302}

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 500ms
      timeout: 500ms
  config:
    import: optional:file:${RAG_SECRETS_FILE:./ai-secrets.yml}
  application:
    name: rag-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:120.92.138.195}:${MYSQL_PORT:3306}/it_ticket_system?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    # 与 main 侧一致：口令仅由环境变量注入，不内置默认值
    password: ${MYSQL_PASSWORD:clt123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

itticket:
  jwt:
    secret: ${JWT_SECRET:it-ticket-dev-jwt-secret-key-32bytes-minimum!!}
  auth:
    exclude-paths:
      - /api/health
      - /error

elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  scheme: ${ES_SCHEME:http}
  index-name: ${ES_KNOWLEDGE_INDEX:knowledge_chunk}
  connect-timeout-ms: 3000
  socket-timeout-ms: 5000
  # 检索类请求超时（RD-003：AI/RAG 完整 15 秒内返回）
  search-timeout-ms: 5000
  # 批量操作（下线状态同步、存量回填）超时
  bulk-timeout-ms: 60000

rag:
  ai-feedback:
    enabled: ${AI_FEEDBACK_CAPTURE_ENABLED:true}
    poll-delay-ms: ${AI_FEEDBACK_POLL_DELAY_MS:5000}
    cache-environment: ${CACHE_ENVIRONMENT:${spring.profiles.active:dev}}
    cache-ttl-seconds: ${AI_FEEDBACK_CACHE_TTL_SECONDS:300}
  embedding:
    # 【手动配置入口】模块根目录 rag-service/ai-secrets.yml。
    # 在该文件填写向量模型 base-url、api-key、model，并核对 dimensions。
    base-url: ${EMBEDDING_BASE_URL:}
    # 不再内置明文默认值：由 EMBEDDING_API_KEY 环境变量注入，未注入时向量化按依赖不可用降级（RD-006）
    model: ${EMBEDDING_MODEL:qwen3.7-text-embedding}
    api-key: ${EMBEDDING_API_KEY:}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    batch-size: 16
    timeout-seconds: 15
  # RAG 检索与知识策略（本模块不做模型生成；对话与生成由 AI 客服服务负责）
  retrieval:
    top-k: ${RAG_TOP_K:5}
    max-top-k: 20
    # 相似度 >= 0.70 视为可靠命中；0.45~0.70 判定 LOW_CONFIDENCE；< 0.45 或无命中允许无引用通用回答。
    confidence-threshold: ${RAG_CONFIDENCE_THRESHOLD:0.70}
    low-confidence-threshold: ${RAG_LOW_CONFIDENCE_THRESHOLD:0.45}
    snippet-length: 1000
  # Dify 知识库通道（文档上传 / 混合索引 / 向量化由 Dify 完成，与自研 ES 链路并行）
  dify:
    enabled: ${DIFY_ENABLED:true}
    base-url: ${DIFY_BASE_URL:http://120.92.138.195:18086/v1}
    # 不再内置明文默认值：由 DIFY_API_KEY 环境变量注入，未注入时调用按依赖不可用降级
    api-key: ${DIFY_API_KEY:}
    # 目标知识库 ID；留空时按 dataset-name 自动创建并复用
    dataset-id: ${DIFY_DATASET_ID:ee7d757d-8ed1-45b9-aa12-c20d80f30e01}
    dataset-name: ${DIFY_DATASET_NAME:it-ticket-knowledge}
    # 必须与目标知识库 doc_form 一致（text_model / hierarchical_model / qa_model）
    doc-form: ${DIFY_DOC_FORM:hierarchical_model}
    indexing-technique: ${DIFY_INDEXING_TECHNIQUE:high_quality}
    search-method: ${DIFY_SEARCH_METHOD:hybrid_search}
    top-k: ${DIFY_TOP_K:5}
    score-threshold: ${DIFY_SCORE_THRESHOLD:0.3}
    timeout-seconds: ${DIFY_TIMEOUT_SECONDS:30}

logging:
  level:
    root: info
    com.itticket.rag: debug
