# ==============================================================================
# RAG 模块本地依赖环境: Elasticsearch 8 + Kibana 8 + Neo4j 5
# ==============================================================================
# 启动命令: docker compose up -d
# 停止命令: docker compose down
#
# 服务访问说明:
# 1. Elasticsearch API: http://localhost:9200
# 2. Kibana 控制台 UI:  http://localhost:5601 (已配置简体中文)
# 3. Neo4j Browser:     http://localhost:7474
# 4. Neo4j Bolt 端点:   bolt://localhost:7687 (凭据: neo4j / neo4j123456)
# ==============================================================================

version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: it-ticket-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200" # REST API & HTTP 查询端口
      - "9300:9300" # 集群节点间通信端口
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - rag-net

  kibana:
    image: kibana:8.11.3
    container_name: it-ticket-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN # 设置 Kibana 管理控制台为简体中文
      - TZ=Asia/Shanghai
    ports:
      - "5601:5601" # Kibana Web 访问端口
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - kibana-data:/usr/share/kibana/data
    networks:
      - rag-net

  neo4j:
    image: neo4j:5.26-community
    container_name: it-ticket-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP / Browser 控制台
      - "7687:7687"   # Bolt 协议驱动连接
    environment:
      - NEO4J_AUTH=neo4j/neo4j123456
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
      - TZ=Asia/Shanghai
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rag-net

volumes:
  es-data:
    name: it-ticket-es-data
  kibana-data:
    name: it-ticket-kibana-data
  neo4j-data:
    name: it-ticket-neo4j-data
  neo4j-logs:
    name: it-ticket-neo4j-logs

networks:
  rag-net:
    name: it-ticket-rag-net
    driver: bridge
