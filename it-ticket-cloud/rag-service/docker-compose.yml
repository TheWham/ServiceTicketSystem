# ==============================================================================
# RAG 模块本地依赖环境: Elasticsearch 8 + Kibana 8
# ==============================================================================
# 启动命令: docker compose up -d
# 停止命令: docker compose down
#
# 服务访问说明:
# 1. Elasticsearch API: http://localhost:9200
# 2. Kibana 控制台 UI:  http://localhost:5601 (已配置简体中文)
# ==============================================================================

version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: it-ticket-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200" # REST API & HTTP 查询端口
      - "9300:9300" # 集群节点间通信端口
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - rag-net

  kibana:
    image: kibana:8.11.3
    container_name: it-ticket-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN # 设置 Kibana 管理控制台为简体中文
      - TZ=Asia/Shanghai
    ports:
      - "5601:5601" # Kibana Web 访问端口
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - kibana-data:/usr/share/kibana/data
    networks:
      - rag-net

volumes:
  es-data:
    name: it-ticket-es-data
  kibana-data:
    name: it-ticket-kibana-data

networks:
  rag-net:
    name: it-ticket-rag-net
    driver: bridge
