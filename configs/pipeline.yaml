# ==============================================================================
# RAG 链路统一配置（唯一真源）
# 改动本文件后重跑 python -m rag_pipeline.pipelines.indexing 重建索引即可全链路生效；
# Day13 加载持久化向量库前会比对配置指纹，切片参数变更自动触发重建。
# ==============================================================================

chunking:
  strategy: parent_child        # 切块策略: parent_child(父子Small-to-Big) | structure_aware(结构感知)
  child_size: 512               # 子块字符预算（含上下文头）
  section_header_level: 2       # 语义边界标题级别：2=按 ## 分节，3=按 ###
  merge_preamble: true          # true: H1标题+导语并入首个小节，不独立成块
  strip_trace_tail: true        # true: 剔除文末"--- + > 🔗 溯源："模板行（仅子块，父块保留）
  boost_injection: first        # 检索增强行(关键词/实体)注入范围: first=仅每卡首块 | all=每个子块 | none=不注入
  breadcrumb_header: true       # true: 每个子块注入【卡片：标题 > 小节】面包屑
  # structure_aware 策略专用（strategy=structure_aware 时生效）
  struct_chunk_size: 550
  struct_chunk_overlap: 80

embedding:
  model: qwen3-embedding-8b     # 可被环境变量 EMBED_MODEL 覆盖
  cache_dir: artifacts/indexing/.emb_cache

store:
  persist_dir: artifacts/indexing/chroma_wiki_structured
  collection: wiki_structured_kb

retrieval:
  top_k: 3                      # 最终返回条数
  rough_top_k: 15               # 粗排候选数（双路各取）
  rrf_k: 60                     # RRF 倒数融合常数
  fuse_k: 10                    # 按秩加权融合的小 k（增强名次区分度）
  rrf_weight: 0.6               # 召回侧权重
  rerank_weight: 0.4            # 精排侧权重
  rerank_granularity: parent    # 精排粒度: child=逐子块打分 | parent=子块召回后对整卡全文打分(返回 Top-K 张卡)
  query_rewrite: true           # 查询改写：LLM 删去用户对原因的猜测并补规范术语；原查询+改写查询四路召回，精排用改写查询
  rewrite_model: ""             # 改写模型，空=取 .env 的 LLM_CLEAN_MODEL（deepseek-v4-flash）
  reject_threshold: 0.40        # 低置信拒答：候选原始 rerank 最高分低于此值返回空（null=不启用）
  # 置信度动态门控：按每次 rerank 打分分布动态切换融合权重（false=固定权重，行为同旧版）
  gate_enabled: true            # true: 高置信时 rerank 大权，低置信/启发式降级时 RRF 托底
  gate_min_score: 0.55          # 高置信门槛①：top-1 原始 rerank 分（本端点正样本 0.6+、负样本 ≤0.26）
  gate_min_margin: 0.10         # 高置信门槛②：top-1 与 top-2 的分差（同次调用内分差，免疫跨后端分漂）
  gate_conf_weights: [0.35, 0.65]  # 高置信时 [rrf_weight, rerank_weight]：放权精排翻盘
  gate_low_weights: [0.65, 0.35]   # 低置信/启发式降级时：召回侧托底
  default_exclude:              # 主链路默认物理屏蔽的元数据坏值
    wiki_status: [已废止, 已下线]

reranker:
  model: qwen3-reranker-8b      # 可被环境变量 RERANK_MODEL 或 CLI --reranker 覆盖
  backend: dashscope            # 仅走 KSP 网关时生效（.env 配了 RERANK_* 直连时忽略）
