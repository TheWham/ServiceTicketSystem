# IT 工单系统前端 nginx 站点配置
# 1) 托管 Vite 构建产物（history 路由回退到 index.html）
# 2) 把 /api 反向代理到后端 gateway 容器（同一 docker 网络内按服务名访问）

upstream it_gateway {
    # gateway 服务名 = compose 中的服务名，容器端口 8080
    server gateway:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # 静态资源根目录（vite build 产物）
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩静态资源
    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1k;

    # 安全相关响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Referrer-Policy        no-referrer-when-downgrade;

    # API 反向代理到 gateway（保持 /api 前缀，gateway 路由按 /api/v1/** 匹配）
    location /api/ {
        proxy_pass         http://it_gateway;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 关闭缓冲以支持长连接/大响应，超时适当放宽（AI 咨询可能较慢）
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket（AI 对话/通知等，若启用则走此路径；gateway 转发升级头）
    location /ws/ {
        proxy_pass         http://it_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 前端 history 路由回退：非静态/非 API 请求一律回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 hash 的构建产物）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
