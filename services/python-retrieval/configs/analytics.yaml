# ==============================================================================
# 分析链路的策略配置（与 taxonomy.yaml 分工：那个管"认出什么故障"，这个管"据此备什么"）
#
# ⚠️ 版本纪律：version 参与配置指纹。系数一改，历史的备件建议就不可复现了
#    —— 与词表同理，改这里等于改口径。
# ==============================================================================

version: "1.0"

# 备件数量规则。
#
# ⚠️ **以下 factor 是演示值**，按工程直觉选的，不是从维修记录学出来的。
#    真实场景应改用历史备件消耗数据反推（每次这类故障平均换掉多少件），
#    外置成配置就是为了换数据源时不改代码。
#
# 为什么按「命中单量 × 固定系数」而不是按占比：占比是会随样本变化的小数，
# 拿它决定备件数量等于让统计噪声驱动采购。命中单量是稳定的实数，口径可复核。
#
# 为什么主要挂 ROOT_CAUSE：**备件是修根因用的，不是修现象用的**。
# 「无法开机」这个现象可能有很多原因，只有知道了根因才知道该备什么件。
# SYMPTOM 那几条是兜底 —— 还没有处置记录（根因不可得）时，仍能给出方向性备货。
#
# 同一备件名从多条规则命中时只保留第一条（ROOT_CAUSE 在前，更具体），
# 避免「电源适配器」被现象和根因各算一遍。
spare_part_rules:
  # —— 按根因（首选）——
  - when: {axis: ROOT_CAUSE, label: 电源故障}
    part: 电源适配器
    unit: 个
    factor: 0.3
  - when: {axis: ROOT_CAUSE, label: 内存故障}
    part: 内存条
    unit: 条
    factor: 0.3
  - when: {axis: ROOT_CAUSE, label: 橡胶老化}
    part: 进纸组件/搓纸轮
    unit: 套
    factor: 0.6
  - when: {axis: ROOT_CAUSE, label: 电容老化}
    part: 同型号交换机
    unit: 台
    factor: 0.5
  - when: {axis: ROOT_CAUSE, label: 散热失效}
    part: 风扇/散热组件
    unit: 套
    factor: 0.5
  # 驱动缺陷 / 硬件接触不良 / 系统文件损坏 / 配置漂移 刻意**不设备件规则**：
  # 这几类不是换件能解决的，硬凑一条备件建议只会误导采购。

  # —— 按现象兜底（根因不可得时用）——
  - when: {axis: SYMPTOM, label: 打印机脱机}
    part: 进纸组件/搓纸轮
    unit: 套
    factor: 0.4
  - when: {axis: SYMPTOM, label: 打印机卡纸}
    part: 进纸组件/搓纸轮
    unit: 套
    factor: 0.5
  - when: {axis: SYMPTOM, label: 无法开机/电源无反应}
    part: 电源适配器
    unit: 个
    factor: 0.3
  - when: {axis: SYMPTOM, label: 网络中断}
    part: 交换机/POE 模块
    unit: 台
    factor: 0.5
  - when: {axis: SYMPTOM, label: 外设失灵}
    part: 键鼠/摄像头
    unit: 套
    factor: 0.2