# ==============================================================================
# 故障标签受控词表（analytics_service 专用）
#
# 为什么外置：词表决定统计口径。写死在代码里就意味着每加一个症状都要改代码、
# 重新走一遍评审；外置成配置后，词表可独立演进，由单测的回归护栏保证不跑偏。
#
# ⚠️ 版本纪律：本文件的版本号参与配置指纹（见 analytics_service/config.py 的
#    taxonomy_fingerprint）。词表一改，历史统计口径就不可复现了 —— 与索引配置同理。
#
# 匹配规则（analytics_service/taxonomy.py 实现）：
#   1. 只做子串包含，不执行任何文本 —— 对描述里的提示词注入天然免疫；
#   2. **最长命中优先**，长度相同再按本文件内的书写顺序；
#   3. **禁止裸泛化词**。像「无反应」「无法调节」「异常」这类词单独出现时不构成
#      症状判据 —— 实测「打印机再次脱机」的描述里同时有"打印机"和"无反应"，
#      「电脑音量无法调节」的描述里也有"无反应"，任何一条裸泛化词都会把它们
#      从各自的正确标签下抢走（截胡）。泛化词必须写成复合词（"电源无反应"）
#      或显式标注 requires_device 后才允许使用。
#   4. requires_device 标注的词，仅当同一段文本另有 DEVICE 命中时才计数。
# ==============================================================================

# 词表版本：任何关键词/标签的增删改都必须同步 +1，否则历史统计无法追溯口径。
version: "1.2"

# 裸泛化词黑名单：这些词不得作为独立关键词出现（除非标注 requires_device）。
# taxonomy.py 加载时校验，单测 test_taxonomy.py 也会断言 —— 一处违规即测试红。
generic_denylist:
  - 无反应
  - 无法调节
  - 无法使用
  - 不工作
  - 异常
  - 失效
  - 故障
  - 报错
  - 问题

SYMPTOM:
  # —— 设备启动类 ——
  - label: 无法开机/电源无反应
    keywords:
      - 无法开机
      - 开不了机
      - 开机无反应
      - 按电源键无反应
      - 电源无反应
      - 按电源键没反应

  # —— 屏幕异常类 ——
  - label: 蓝屏
    keywords:
      - 蓝屏

  # —— 应用异常类 ——
  - label: 应用闪退
    keywords:
      - 闪退
      - 自动退出
      - 打开即崩溃

  # —— 打印设备类（专有词，最长命中优先保证不被通用症状抢走）——
  - label: 打印机脱机
    keywords:
      - 打印机脱机
      - 脱机
      - 无法打印
      - 打印无反应
      - 打印任务无反应
      - 打印没反应

  - label: 打印机卡纸
    keywords:
      - 卡纸
      - 进纸异常
      - 进纸组件异响
      - 频繁卡纸
      - 纸道堵塞

  # —— 账号与网络接入类 ——
  - label: VPN连接失败
    keywords:
      - vpn
      - 连接失败
      - 连不上
      - 拨号超时
      - 远程桌面连不上

  - label: 无线网络异常
    keywords:
      - wifi
      - wifi无法打开
      - 无线网络
      - 无法联网
      - 搜不到信号

  - label: 网络中断
    keywords:
      - 网络中断
      - 网络瘫痪
      - 交换机掉线
      - 断网

  # —— 外设与影音类 ——
  - label: 外设失灵
    keywords:
      - 屏幕亮度
      - 音量无法
      - 没有声音
      - 光标
      - 摄像头
      - 鼠标
      - 键盘
      - 显示器无

DEVICE:
  - label: 笔记本
    keywords: ["笔记本", "便携"]
  - label: 台式机
    keywords: ["台式机", "台式电脑", "主机"]
  - label: 打印机
    keywords: ["打印机", "扫描仪", "一体机"]
  - label: 网络设备
    keywords: ["交换机", "路由器", "网关", "网线", "无线 AP", "AP"]
  - label: 外设
    keywords: ["鼠标", "键盘", "摄像头", "显示器", "音箱", "耳机"]

# 子域定义：把「网络与打印设备」这类范围限定词映射到 (设备, 症状) 集合。
#
# ⚠️ 必须基于词典，**不能基于 category_id** —— 实测唯一那张打印机工单的
#    category_id 是 C_HW_PC（提交人手选的），而 C_HW_PR 分类 0 张工单。
#    按分类过滤会静默漏掉它，且漏得毫无声响。
#
# 一个工单属于某子域的条件：其 device 命中该子域的 devices，**或**其 symptom
# 命中该子域的 symptoms（取并集 —— 只看 device 会漏掉"VPN连不上"这类
# 没写明设备的单，只看 symptom 会漏掉"交换机"这类没写明症状的单）。
# 子域名的匹配同样走最长命中优先。
DOMAIN:
  - name: 网络与打印设备
    keywords: ["网络与打印", "网络和打印", "网络与打印设备", "网络及打印"]
    devices: ["网络设备", "打印机"]
    symptoms: ["VPN连接失败", "无线网络异常", "网络中断", "打印机脱机", "打印机卡纸"]

  - name: 打印设备
    keywords: ["打印设备", "打印机", "打印"]
    devices: ["打印机"]
    symptoms: ["打印机脱机", "打印机卡纸"]

  - name: 网络设备
    keywords: ["网络设备", "网络", "联网"]
    devices: ["网络设备"]
    symptoms: ["VPN连接失败", "无线网络异常", "网络中断"]

  - name: 终端设备
    keywords: ["终端设备", "电脑设备", "电脑", "笔记本", "台式机"]
    devices: ["笔记本", "台式机"]
    symptoms: ["无法开机/电源无反应", "蓝屏", "应用闪退"]

  - name: 外设
    keywords: ["外设", "周边设备", "影音设备"]
    devices: ["外设"]
    symptoms: ["外设失灵"]

# 根因维度：只从 ticket_resolution.solution 文本抽取，**绝不从工单描述推断**
# —— 从描述猜根因正是幻觉的主要来源。
#
# 词表按**实际工单的症状构成**设计：本地这批工单里"无法开机"与"蓝屏"合计占多数，
# 对应的现实根因是电源与内存，而不是抽象的老化词。同时刻意保留了几条**跨症状**的
# 根因（驱动缺陷会同时出现在蓝屏、外设失灵、无线异常上）—— 跨症状的共性是"共性根因"
# 真正要回答的问题，每个症状各配一个根因等于什么都没归纳。
ROOT_CAUSE:
  # —— 终端硬件类（覆盖实际工单里占比最高的两类故障）——
  - label: 电源故障
    keywords: ["电源适配器损坏", "电源适配器失效", "主板供电故障", "电源键接触不良",
               "电池老化", "供电模块损坏", "适配器无输出"]
  - label: 内存故障
    keywords: ["内存条接触不良", "内存条故障", "内存条损坏", "内存条老化", "内存颗粒损坏",
               "内存条氧化"]
  # —— 跨症状的软件类根因：同一根因会同时出现在蓝屏、外设失灵、无线异常上，
  #    这正是"共性根因"该有的形态，而不是每个症状各配一个根因。——
  - label: 驱动缺陷
    keywords: ["驱动版本缺陷", "驱动不兼容", "驱动回退", "驱动冲突", "驱动未签名"]
  - label: 硬件接触不良
    keywords: ["接口氧化", "金手指氧化", "接触不良", "插槽松动", "排线松动"]
  - label: 系统文件损坏
    keywords: ["系统文件损坏", "系统盘坏道", "引导文件损坏", "系统镜像损坏"]
  # —— 配置与老化类 ——
  - label: 配置漂移
    keywords: ["配置漂移", "配置被改", "参数错误", "策略冲突", "许可证耗尽"]
  - label: 散热失效
    keywords: ["散热失效", "散热不良", "风道堵塞", "积尘", "过热关机", "风扇转速异常"]
  - label: 橡胶老化
    keywords: ["橡胶老化", "搓纸轮磨损", "搓纸轮老化", "进纸组件老化"]
  - label: 电容老化
    keywords: ["电容漏液", "电容老化", "电容鼓包", "供电不足"]
  - label: 机械磨损
    keywords: ["机械磨损", "齿轮磨损", "传动异常", "轴承异响"]
  - label: 固件缺陷
    keywords: ["固件缺陷", "固件升级", "版本缺陷"]