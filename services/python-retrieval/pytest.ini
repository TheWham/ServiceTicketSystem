[pytest]
# 服务端检索服务的 pytest 配置（对齐 acceptance/pytest.ini 的既有惯例）。
# D-33：注册自定义 mark，消除 PytestUnknownMarkWarning——
#   - neo4j：需要真实可用的 Neo4j 图库（NEO4J_PASSWORD / .env）才真正执行，
#     否则用例内 skip；
#   - graph_e2e：需要真库 + 开图（graph.enabled=true）的图端到端金标用例，
#     默认 pipeline.yaml 关图时 skip。
markers =
    neo4j: 需要真实 Neo4j 图库（凭证/端口可用）的集成测试，不可用时 skip
    graph_e2e: 需要真库且开图（graph.enabled=true）的图端到端金标用例，默认关图时 skip
