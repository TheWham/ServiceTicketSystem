# ==============================================================================
# 构建全部微服务镜像并推送 GHCR (ghcr.io)
#
# 触发：push 到 main（改了 it-ticket-cloud/、frontend/、services/python-retrieval/
#       或本 workflow 时才跑，省 CI 时间）
# 产物：ghcr.io/<owner>/it-ticket-{gateway,user-service,ticket-service,rag-service,
#       consultation-service,frontend,python-ai}
#       tag = latest + 短 sha。镜像继承仓库可见性（私有仓库 → 私有镜像）。
#
# 每个模块的构建上下文 / Dockerfile 在 matrix 里显式给出：
#   - 5 个 Java 服务与 frontend 共用各自的 Dockerfile，Java 模块用 build-arg 选择；
#   - python-ai 是 services/python-retrieval 的 agent_service 镜像，对应 deploy
#     compose 的 agent-service，context 与 Java 模块不同，故单独一行。
#
# 服务器侧配合：deploy/docker-compose.yml 用 PAT (read:packages) 拉取。
# 注意：ghcr.io 镜像名必须全小写，owner 名含大写时需转小写（IMAGE_PREFIX 处理）。
# ==============================================================================

name: Build & Push to GHCR

on:
  push:
    branches: [main]
    paths:
      - "it-ticket-cloud/**"
      - "frontend/**"
      - "services/python-retrieval/**"
      - ".github/workflows/docker-ghcr.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: gateway
            context: it-ticket-cloud
            file: it-ticket-cloud/Dockerfile
            build_args: |
              MODULE=gateway
              SERVICE_PORT=8080
          - module: user-service
            context: it-ticket-cloud
            file: it-ticket-cloud/Dockerfile
            build_args: |
              MODULE=user-service
              SERVICE_PORT=8101
          - module: ticket-service
            context: it-ticket-cloud
            file: it-ticket-cloud/Dockerfile
            build_args: |
              MODULE=ticket-service
              SERVICE_PORT=8201
          - module: rag-service
            context: it-ticket-cloud
            file: it-ticket-cloud/Dockerfile
            build_args: |
              MODULE=rag-service
              SERVICE_PORT=8302
          - module: consultation-service
            context: it-ticket-cloud
            file: it-ticket-cloud/Dockerfile
            build_args: |
              MODULE=consultation-service
              SERVICE_PORT=8301
          - module: frontend
            context: frontend
            file: frontend/Dockerfile
            build_args: ""
          - module: python-ai
            context: services/python-retrieval
            file: services/python-retrieval/Dockerfile
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: owner
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.owner.outputs.prefix }}/it-ticket-${{ matrix.module }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=it-ticket-${{ matrix.module }}
          cache-to: type=gha,scope=it-ticket-${{ matrix.module }},mode=max
