openapi: 3.1.0
info:
  title: IT Service Ticket System Core API
  version: 2.0.0
  description: |
    非 AI 核心 HTTP 契约。AI/RAG 接口由 AI-005 单独定义；字段和枚举引用 DM-002/DM-004，动作引用 SM-*，错误与重试引用 RD-*。
    2.0.0 按 PRD2.2 统一业务字段；路径继续 /api/v1，旧请求字段仅在已声明的实现兼容层读取，新响应使用当前字段。协议版本升级不表示所有规划接口已经实现。
servers:
  - url: /api/v1
security:
  - ssoSession: []
    requestId: []
tags:
  - name: Consultations
  - name: Tickets
  - name: Messages
  - name: Attachments
  - name: Knowledge
  - name: Administration
paths:
  /consultations/{id}/messages:
    post:
      tags: [Consultations]
      operationId: sendHumanConsultationMessage
      summary: 发送人工咨询消息
      parameters: [{ $ref: '#/components/parameters/SessionId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { $ref: '#/components/requestBodies/Content' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
    get:
      tags: [Consultations]
      operationId: listConsultationMessages
      parameters: [{ $ref: '#/components/parameters/SessionId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
  /consultations/{id}/resolution:
    post:
      tags: [Consultations]
      operationId: resolveConsultation
      summary: 提交咨询解决结论
      parameters: [{ $ref: '#/components/parameters/SessionId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConsultationResolution' } } } }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /consultations/{id}/reopen:
    post:
      tags: [Consultations]
      operationId: reopenConsultation
      summary: 24 小时窗口内恢复咨询
      parameters: [{ $ref: '#/components/parameters/SessionId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /consultations/{id}/ticket-draft:
    get:
      tags: [Consultations]
      operationId: getTicketDraftFromConsultation
      summary: 获取咨询转单预填
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /ticket-drafts/{id}:
    put:
      tags: [Tickets]
      operationId: saveTicketDraft
      summary: 保存当前员工草稿
      parameters: [{ $ref: '#/components/parameters/DraftId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { $ref: '#/components/requestBodies/Draft' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets:
    post:
      tags: [Tickets]
      operationId: createTicket
      summary: 提交正式工单
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { $ref: '#/components/requestBodies/TicketCreate' }
      responses: { '201': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: 按服务端权限查询工单
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: status, in: query, schema: { type: string }, description: 仅接受 DM-002 的 TicketStatus }
        - { name: ownerScope, in: query, schema: { type: string, enum: [MINE, CURRENT, HISTORY, ALL] }, default: MINE }
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}:
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: 获取按权限裁剪的工单详情
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/accept:
    post:
      tags: [Tickets]
      operationId: acceptTicket
      summary: 工程师接单并确认影响/紧急程度
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Impact' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/supplement-requests:
    post:
      tags: [Tickets]
      operationId: requestTicketSupplement
      summary: 请求员工补充
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Content' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/supplements:
    post:
      tags: [Tickets]
      operationId: submitTicketSupplement
      summary: 员工提交补充材料
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Content' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/external-waits:
    post:
      tags: [Tickets]
      operationId: startExternalWait
      summary: 进入外部等待
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ExternalWait' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/resume:
    post:
      tags: [Tickets]
      operationId: resumeTicket
      summary: 恢复合法等待
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/resolution:
    post:
      tags: [Tickets]
      operationId: submitTicketResolution
      summary: 提交解决方案进入待验收
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Resolution' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/acceptance:
    post:
      tags: [Tickets]
      operationId: acceptOrRejectTicket
      summary: 员工验收或驳回
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Acceptance' } } } }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/cancel:
    post:
      tags: [Tickets]
      operationId: cancelTicket
      summary: 员工撤销未终结工单
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/transfer:
    post:
      tags: [Tickets]
      operationId: requestTicketTransfer
      summary: 工程师申请转派
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/admin-actions:
    post:
      tags: [Administration]
      operationId: performTicketAdminAction
      summary: 平台管理员执行干预
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAction' } } } }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/messages:
    post:
      tags: [Messages]
      operationId: sendTicketMessage
      summary: 发送工单聊天消息
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Content' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
    get:
      tags: [Messages]
      operationId: listTicketMessages
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
  /messages/{id}/withdraw:
    post:
      tags: [Messages]
      operationId: withdrawMessage
      summary: 五分钟内撤回消息
      parameters: [{ $ref: '#/components/parameters/MessageId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /attachments:
    post:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: 上传并提交安全扫描
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/AttachmentUpload' } } } }
      responses: { '201': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /cases/{id}/review:
    post:
      tags: [Knowledge]
      operationId: reviewCase
      summary: 审核脱敏案例
      parameters: [{ $ref: '#/components/parameters/CaseId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Review' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /knowledge/{id}/publish:
    post:
      tags: [Knowledge]
      operationId: publishKnowledge
      summary: 发布知识版本
      parameters: [{ $ref: '#/components/parameters/ArticleId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /knowledge/{id}/offline:
    post:
      tags: [Knowledge]
      operationId: offlineKnowledge
      summary: 下线知识版本
      parameters: [{ $ref: '#/components/parameters/ArticleId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /admin/identity-sync:
    post:
      tags: [Administration]
      operationId: triggerIdentitySync
      summary: 触发 HR/组织同步
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /consultations/{id}:
    get:
      tags: [Consultations]
      operationId: getConsultation
      parameters: [{ $ref: '#/components/parameters/SessionId' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Consultation' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /consultations/{id}/close:
    post:
      tags: [Consultations]
      operationId: closeConsultation
      parameters: [{ $ref: '#/components/parameters/SessionId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Consultation' }, '409': { $ref: '#/components/responses/Error' }, default: { $ref: '#/components/responses/Error' } }
  /attachments/{id}:
    get:
      tags: [Attachments]
      operationId: getAttachment
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Attachment' }, default: { $ref: '#/components/responses/Error' } }
  /attachments/{id}/download:
    get:
      tags: [Attachments]
      operationId: getAttachmentDownloadGrant
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Attachment' }, default: { $ref: '#/components/responses/Error' } }
  /attachments/{id}/withdraw:
    post:
      tags: [Attachments]
      operationId: withdrawAttachment
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Attachment' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/sla:
    get:
      tags: [Tickets]
      operationId: getTicketSla
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Sla' }, default: { $ref: '#/components/responses/Error' } }
  /tickets/{id}/transitions:
    get:
      tags: [Tickets]
      operationId: listTicketTransitions
      parameters: [{ $ref: '#/components/parameters/TicketId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
  /notifications:
    get:
      tags: [Administration]
      operationId: listNotifications
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
  /notifications/{id}/read:
    post:
      tags: [Administration]
      operationId: markNotificationRead
      parameters: [{ $ref: '#/components/parameters/NotificationId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /admin/exceptions:
    get:
      tags: [Administration]
      operationId: listExceptionQueue
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
  /admin/exceptions/{id}/claim:
    post:
      tags: [Administration]
      operationId: claimException
      parameters: [{ $ref: '#/components/parameters/ExceptionId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Envelope' }, '409': { $ref: '#/components/responses/Error' }, default: { $ref: '#/components/responses/Error' } }
  /admin/exceptions/{id}/resolve:
    post:
      tags: [Administration]
      operationId: resolveException
      parameters: [{ $ref: '#/components/parameters/ExceptionId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /consultations:
    get:
      tags: [Consultations]
      operationId: listConsultations
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
  /engineers/me/presence:
    put:
      tags: [Administration]
      operationId: updateMyEngineerPresence
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Presence' } } } }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /admin/audit/withdrawn-messages/{id}:
    get:
      tags: [Administration]
      operationId: readWithdrawnMessageAudit
      parameters: [{ $ref: '#/components/parameters/MessageId' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Error' }, default: { $ref: '#/components/responses/Error' } }
  /knowledge/{id}/versions:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeVersions
      parameters: [{ $ref: '#/components/parameters/ArticleId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
  /knowledge/{id}/rollback:
    post:
      tags: [Knowledge]
      operationId: rollbackKnowledge
      parameters: [{ $ref: '#/components/parameters/ArticleId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Rollback' } } } }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, '409': { $ref: '#/components/responses/Error' }, default: { $ref: '#/components/responses/Error' } }
  /admin/users:
    get:
      tags: [Administration]
      operationId: listUsers
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
  /admin/roles:
    put:
      tags: [Administration]
      operationId: replaceUserRoles
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleChange' } } } }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /admin/teams:
    get:
      tags: [Administration]
      operationId: listTeams
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
    post:
      tags: [Administration]
      operationId: createTeam
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NamedConfig' } } } }
      responses: { '201': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /admin/categories:
    get:
      tags: [Administration]
      operationId: listCategories
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/RequestId' }]
      responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } }
    post:
      tags: [Administration]
      operationId: createCategory
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NamedConfig' } } } }
      responses: { '201': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /admin/sla-config:
    put:
      tags: [Administration]
      operationId: updateSlaConfig
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SlaConfig' } } } }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, '422': { $ref: '#/components/responses/Error' }, default: { $ref: '#/components/responses/Error' } }
  /knowledge:
    post:
      tags: [Knowledge]
      operationId: createKnowledgeDraft
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeDraft' } } } }
      responses: { '201': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /knowledge/{id}/review:
    post:
      tags: [Knowledge]
      operationId: reviewKnowledge
      parameters: [{ $ref: '#/components/parameters/ArticleId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequestId' }]
      requestBody: { $ref: '#/components/requestBodies/Review' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, '409': { $ref: '#/components/responses/Error' }, default: { $ref: '#/components/responses/Error' } }
  /admin/team-members:
    put: { tags: [Administration], operationId: replaceTeamMembers, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { $ref: '#/components/requestBodies/AdminConfig' }, responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } } }
  /admin/category-routes:
    put: { tags: [Administration], operationId: replaceCategoryRoutes, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { $ref: '#/components/requestBodies/AdminConfig' }, responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } } }
  /admin/field-definitions:
    put: { tags: [Administration], operationId: replaceFieldDefinitions, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { $ref: '#/components/requestBodies/AdminConfig' }, responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } } }
  /admin/service-calendars:
    put: { tags: [Administration], operationId: updateServiceCalendar, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { $ref: '#/components/requestBodies/AdminConfig' }, responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } } }
  /admin/holidays:
    put: { tags: [Administration], operationId: replaceHolidays, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { $ref: '#/components/requestBodies/AdminConfig' }, responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } } }
  /admin/config/{configType}:
    put:
      tags: [Administration]
      operationId: updatePlatformConfig
      parameters: [{ name: configType, in: path, required: true, schema: { type: string, enum: [NOTIFICATION, ATTACHMENT, RETENTION, AI_SWITCH] } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/AdminConfig' }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } }
  /cases:
    get: { tags: [Knowledge], operationId: listCaseCandidates, parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/Paged' }, default: { $ref: '#/components/responses/Error' } } }
  /knowledge/{id}/submit-review:
    post: { tags: [Knowledge], operationId: submitKnowledgeReview, parameters: [{ $ref: '#/components/parameters/ArticleId' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { $ref: '#/components/requestBodies/Reason' }, responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } } }
  /knowledge/{id}/high-risk-review:
    post: { tags: [Knowledge], operationId: reviewHighRiskKnowledge, parameters: [{ $ref: '#/components/parameters/ArticleId' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { $ref: '#/components/requestBodies/Review' }, responses: { '200': { $ref: '#/components/responses/Envelope' }, default: { $ref: '#/components/responses/Error' } } }
components:
  securitySchemes:
    ssoSession: { type: http, scheme: bearer, bearerFormat: SSO-session }
    requestId: { type: apiKey, in: header, name: X-Request-Id }
  parameters:
    SessionId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    TicketId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    DraftId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    MessageId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    AttachmentId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    CaseId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    ArticleId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    NotificationId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    ExceptionId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    RequestId: { name: X-Request-Id, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  requestBodies:
    Content: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Content' } } } }
    Reason: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
    Resolution: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Resolution' } } } }
    Draft: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }
    TicketCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TicketCreate' } } } }
    Impact: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Impact' } } } }
    ExternalWait: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalWait' } } } }
    Review: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
    AdminConfig: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfig' } } } }
  responses:
    Envelope: { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    Paged: { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/PagedEnvelope' } } } }
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Consultation: { description: Consultation, content: { application/json: { schema: { $ref: '#/components/schemas/ConsultationEnvelope' } } } }
    Attachment: { description: Attachment, content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentEnvelope' } } } }
    Sla: { description: SLA, content: { application/json: { schema: { $ref: '#/components/schemas/SlaEnvelope' } } } }
  schemas:
    Envelope: { type: object, required: [code, message, request_id, data], properties: { code: { type: string }, message: { type: string }, request_id: { type: string }, data: { oneOf: [{ $ref: '#/components/schemas/ConsultationProjection' }, { $ref: '#/components/schemas/TicketProjection' }, { $ref: '#/components/schemas/MessageProjection' }, { $ref: '#/components/schemas/AttachmentProjection' }, { $ref: '#/components/schemas/ActionProjection' }] } }, additionalProperties: false }
    PagedEnvelope: { type: object, required: [code, message, request_id, data], properties: { code: { type: string }, message: { type: string }, request_id: { type: string }, data: { type: object, required: [items, page, pageSize, total], properties: { items: { type: array, items: { oneOf: [{ $ref: '#/components/schemas/TicketProjection' }, { $ref: '#/components/schemas/ConsultationProjection' }, { $ref: '#/components/schemas/MessageProjection' }, { $ref: '#/components/schemas/NotificationProjection' }, { $ref: '#/components/schemas/ExceptionProjection' }, { $ref: '#/components/schemas/UserProjection' }, { $ref: '#/components/schemas/TeamProjection' }, { $ref: '#/components/schemas/CategoryProjection' }, { $ref: '#/components/schemas/TransitionProjection' }, { $ref: '#/components/schemas/KnowledgeVersionProjection' }, { $ref: '#/components/schemas/ConfigProjection' }, { $ref: '#/components/schemas/CaseCandidateProjection' }] } }, page: { type: integer }, pageSize: { type: integer }, total: { type: integer } }, additionalProperties: false } }, additionalProperties: false }
    ErrorEnvelope: { type: object, required: [code, message, request_id], properties: { code: { type: string }, message: { type: string }, request_id: { type: string }, errors: { type: array, items: { type: object, required: [field, reason], properties: { field: { type: string }, reason: { type: string }, message: { type: string } }, additionalProperties: false } } }, additionalProperties: false }
    Content: { type: object, required: [client_message_id], additionalProperties: false, anyOf: [{ required: [content] }, { required: [attachment_ids] }], properties: { content: { type: string, minLength: 1, maxLength: 12000 }, client_message_id: { type: string, minLength: 1, maxLength: 64 }, attachment_ids: { type: array, minItems: 1, items: { type: string, maxLength: 64 }, maxItems: 10 } } }
    Reason: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } }
    Resolution: { type: object, required: [solution, verification], additionalProperties: false, properties: { solution: { type: string, minLength: 1, maxLength: 12000 }, verification: { type: string, minLength: 1, maxLength: 4000 } } }
    Draft: { type: object, additionalProperties: false, properties: { payload: { type: object }, expires_at: { type: string, format: date-time } } }
    ConsultationResolution: { type: object, required: [conclusion], additionalProperties: false, properties: { conclusion: { type: string, minLength: 1, maxLength: 12000 } } }
    TicketCreate: { type: object, required: [nature, category_id, title, description, impact_description, urgency_description], additionalProperties: false, properties: { nature: { type: string, enum: [INCIDENT, SERVICE_REQUEST] }, category_id: { type: string, minLength: 1, maxLength: 64 }, title: { type: string, minLength: 1, maxLength: 100 }, description: { type: string, minLength: 10, maxLength: 5000 }, impact_description: { type: string, minLength: 1, maxLength: 2000 }, urgency_description: { type: string, minLength: 1, maxLength: 2000 }, location: { type: string, maxLength: 255 }, contact: { type: string, maxLength: 255 }, asset_id: { type: string, maxLength: 64 }, source_session_id: { type: string, maxLength: 32 }, field_values: { type: object } } }
    Impact: { type: object, required: [impact_level, urgency_level], additionalProperties: false, properties: { impact_level: { type: string, enum: [SINGLE_EMPLOYEE, DEPARTMENT, CROSS_DEPARTMENT_OR_CORE] }, urgency_level: { type: string, enum: [LOW, MEDIUM, HIGH] } } }
    ExternalWait: { type: object, required: [dependency_type, reason, expected_at], additionalProperties: false, properties: { dependency_type: { type: string, enum: [SPARE_PART, VENDOR, CARRIER, OTHER] }, reason: { type: string, minLength: 1, maxLength: 2000 }, expected_at: { type: string, format: date-time } } }
    Acceptance: { type: object, required: [result], additionalProperties: false, properties: { result: { type: string, enum: [ACCEPTED, REJECTED] }, reason: { type: string, minLength: 1, maxLength: 2000 }, rating_score: { type: integer, minimum: 1, maximum: 5 }, rating_comment: { type: string, maxLength: 2000 } }, allOf: [{ if: { properties: { result: { const: REJECTED } } }, then: { required: [reason] } }] }
    AdminAction: { type: object, required: [action, reason, confirmation_token], additionalProperties: false, properties: { action: { type: string, enum: [TRANSFER, CHANGE_PRIORITY, EXCEPTION_CLOSE, REOPEN, MARK_DUPLICATE] }, reason: { type: string, minLength: 1, maxLength: 2000 }, target_engineer_id: { type: string, maxLength: 64 }, target_priority: { type: string, enum: [HIGH, MEDIUM, LOW] }, master_ticket_id: { type: string, maxLength: 32 }, confirmation_token: { type: string, minLength: 1, maxLength: 512 } } }
    AttachmentUpload: { type: object, required: [biz_type, biz_id, file], additionalProperties: false, properties: { biz_type: { type: string }, biz_id: { type: string }, file: { type: string, format: binary } } }
    Review: { type: object, required: [decision], additionalProperties: false, properties: { decision: { type: string, enum: [ACCEPTED, REJECTED] }, reason: { type: string, maxLength: 2000 }, reviewer_comment: { type: string, maxLength: 4000 } } }
    Presence: { type: object, required: [presence], additionalProperties: false, properties: { presence: { type: string, enum: [AVAILABLE, BUSY, AWAY, OFFLINE] } } }
    Rollback: { type: object, required: [version_id, reason], additionalProperties: false, properties: { version_id: { type: string, minLength: 1, maxLength: 64 }, reason: { type: string, minLength: 1, maxLength: 2000 } } }
    RoleChange: { type: object, required: [user_id, roles, confirmation_token], additionalProperties: false, properties: { user_id: { type: string, minLength: 1, maxLength: 64 }, roles: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [EMPLOYEE, ENGINEER, PLATFORM_ADMIN, KNOWLEDGE_ADMIN] } }, confirmation_token: { type: string, minLength: 1, maxLength: 512 } } }
    NamedConfig: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 255 }, status: { type: string, enum: [ACTIVE, DISABLED], default: ACTIVE } } }
    SlaConfig: { type: object, required: [timezone, work_intervals, lunch_pauses], additionalProperties: false, properties: { timezone: { type: string, minLength: 1, maxLength: 64 }, work_intervals: { type: array, minItems: 1, items: { type: object } }, lunch_pauses: { type: boolean } } }
    KnowledgeDraft: { type: object, required: [category_id, risk_level, content], additionalProperties: false, properties: { category_id: { type: string, minLength: 1, maxLength: 64 }, risk_level: { type: string, enum: [NORMAL, HIGH] }, content: { type: object }, change_note: { type: string, maxLength: 2000 } } }
    AdminConfig: { type: object, required: [version, payload], additionalProperties: false, properties: { version: { type: integer, minimum: 0 }, payload: { type: object } } }
    UserProjection: { type: object, required: [user_id, employee_no, name, department_id, status, identity_source], additionalProperties: false, properties: { user_id: { type: string, maxLength: 64 }, employee_no: { type: string, maxLength: 64 }, name: { type: string, maxLength: 255 }, department_id: { type: string, maxLength: 64 }, status: { type: string, maxLength: 32 }, identity_source: { type: string, maxLength: 64 }, role: { type: string, enum: [EMPLOYEE, ENGINEER, PLATFORM_ADMIN, KNOWLEDGE_ADMIN] } } }
    TeamProjection: { type: object, required: [team_id, name, status], additionalProperties: false, properties: { team_id: { type: string }, name: { type: string }, status: { type: string } } }
    CategoryProjection: { type: object, required: [category_id, ticket_nature, name, level, status], additionalProperties: false, properties: { category_id: { type: string }, parent_id: { type: [string, 'null'] }, ticket_nature: { type: string, enum: [INCIDENT, SERVICE_REQUEST] }, name: { type: string }, level: { type: integer }, status: { type: string }, definition_version: { type: string }, version: { type: integer }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    TransitionProjection: { type: object, required: [transition_id, event, occurred_at], additionalProperties: false, properties: { transition_id: { type: string }, event: { type: string }, occurred_at: { type: string, format: date-time } } }
    KnowledgeVersionProjection: { type: object, required: [version_id, version_no], additionalProperties: false, properties: { version_id: { type: string }, version_no: { type: integer }, published_at: { type: [string, 'null'], format: date-time } } }
    ConfigProjection: { type: object, required: [config_type, version], additionalProperties: false, properties: { config_type: { type: string }, version: { type: integer }, payload: { type: object } } }
    CaseCandidateProjection: { type: object, required: [case_id, source_type, masking_status, status], additionalProperties: false, properties: { case_id: { type: string, maxLength: 64 }, source_type: { type: string, enum: [CONSULTATION, TICKET] }, masking_status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, PASSED, FAILED] }, status: { type: string, enum: [PENDING_MASKING, PENDING_REVIEW, REJECTED, ACCEPTED, DISCARDED] } } }
    ConsultationEnvelope: { type: object, required: [code, message, request_id, data], properties: { code: { type: string }, message: { type: string }, request_id: { type: string }, data: { $ref: '#/components/schemas/ConsultationProjection' } }, additionalProperties: false }
    AttachmentEnvelope: { type: object, required: [code, message, request_id, data], properties: { code: { type: string }, message: { type: string }, request_id: { type: string }, data: { $ref: '#/components/schemas/AttachmentProjection' } }, additionalProperties: false }
    SlaEnvelope: { type: object, required: [code, message, request_id, data], properties: { code: { type: string }, message: { type: string }, request_id: { type: string }, data: { type: object, required: [sla_id, status], properties: { sla_id: { type: string }, status: { type: string }, elapsed_work_seconds: { type: integer, minimum: 0 }, target_at: { type: string, format: date-time } }, additionalProperties: false } }, additionalProperties: false }
    ConsultationProjection: { type: object, required: [session_id, status, creator_id], properties: { session_id: { type: string, maxLength: 32 }, status: { type: string }, creator_id: { type: string, maxLength: 64, description: '咨询申请人账号，用于工程师识别申请人' }, current_engineer_id: { type: [string, 'null'], maxLength: 64 }, converted_ticket_id: { type: [string, 'null'], maxLength: 32 } }, additionalProperties: false }
    TicketProjection: { type: object, required: [ticket_id, status, priority, version], properties: { ticket_id: { type: string, maxLength: 32 }, status: { type: string }, priority: { type: string, enum: [HIGH, MEDIUM, LOW] }, assignee_id: { type: [string, 'null'], maxLength: 64 }, version: { type: integer, minimum: 0 } }, additionalProperties: false }
    MessageProjection:
      type: object
      required: [message_id, sent_at]
      additionalProperties: false
      properties:
        message_id: { type: string, maxLength: 64 }
        sender_type: { type: string, enum: [EMPLOYEE, ENGINEER, AI, SYSTEM] }
        content: { type: string }
        citations:
          type: [array, 'null']
          description: AI-003 KnowledgeCitation；仅包含经校验的已发布知识引用
          items: { $ref: '#/components/schemas/KnowledgeCitation' }
        interaction_id: { type: [string, 'null'], maxLength: 64, description: AI 反馈关联 ID；旧消息可缺失 }
        reply_type: { type: [string, 'null'], enum: [ANSWER, CLARIFY, REFUSE, null] }
        refusal_reason: { type: [string, 'null'], enum: [NO_RELIABLE_KNOWLEDGE, LOW_CONFIDENCE, CONFLICTING_KNOWLEDGE, HIGH_RISK_TOPIC, MODEL_UNAVAILABLE, POLICY_BLOCKED, OFF_TOPIC, null] }
        general_answer: { type: [boolean, 'null'], description: 经校验的无知识库引用通用回答；旧消息不推断 }
        sent_at: { type: string, format: date-time }
        withdrawn_at: { type: [string, 'null'], format: date-time }
    KnowledgeCitation:
      type: object
      additionalProperties: false
      required: [articleId, versionId, title, score, snippet]
      properties:
        articleId: { type: string, minLength: 1, maxLength: 64 }
        versionId: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        score: { type: number, minimum: 0, maximum: 1 }
        snippet: { type: string, minLength: 1, maxLength: 1000 }
    AttachmentProjection: { type: object, required: [attachment_id, scan_status], properties: { attachment_id: { type: string, maxLength: 64 }, scan_status: { type: string, enum: [PENDING, PASSED, REJECTED, ERROR] }, download_url: { type: [string, 'null'], format: uri } }, additionalProperties: false }
    ActionProjection: { type: object, required: [operation_id], properties: { operation_id: { type: string }, accepted: { type: boolean } }, additionalProperties: false }
    NotificationProjection: { type: object, required: [notification_id, status], properties: { notification_id: { type: string }, status: { type: string } }, additionalProperties: false }
    ExceptionProjection: { type: object, required: [exception_id, status], properties: { exception_id: { type: string }, status: { type: string }, object_id: { type: string } }, additionalProperties: false }
x-required-headers:
  - X-Request-Id: required on every request; server generates one only when absent for non-write reads.
  - Idempotency-Key: required on all write operations; message writes additionally require client_message_id.
